# Local services. For now only Postgres; the server and worker join later.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: droid247
      POSTGRES_PASSWORD: droid247
      POSTGRES_DB: droid247
    ports:
      # 5433 on the host so it doesn't clash with a locally installed Postgres.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U droid247']
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
