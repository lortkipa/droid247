[package]
name = "droid247"
version = "0.1.0"
description = "droid247 desktop app"
edition = "2021"
publish = false

[lib]
# `staticlib` and `cdylib` are what Tauri's iOS/Android builds link against.
name = "droid247_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
