[package]
name = "droid247-desktop"
version = "0.1.0"
description = "Droid247 desktop app"
edition = "2021"
publish = false

[lib]
name = "droid247_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
# tauri::generate_context! embeds plugin config from tauri.conf.json as JSON.
serde_json = "1"

# Second launches (e.g. the OS opening a droid247:// link) hand over to the
# running app instead of opening another window. Not available on mobile.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
